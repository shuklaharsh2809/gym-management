# Local development database only. Not a production configuration.
services:
  postgres:
    image: postgres:17
    container_name: fitgrid-postgres
    environment:
      POSTGRES_USER: fitgrid
      POSTGRES_PASSWORD: fitgrid
      POSTGRES_DB: fitgrid
    ports:
      - "5433:5432"
    volumes:
      - fitgrid-pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitgrid"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  fitgrid-pgdata:
